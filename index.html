<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="favicon.svg"></head><body>
<title>Курсы относительно ветра</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: chart-table — sticky module rail on the left, a reading column, the simulator as a wide instrument panel. */
:root{
  --paper:#EDF2F5; --surface:#FFFFFF; --ink:#0E2433; --muted:#4B6272; --line:#C8D5DD;
  --sea:#D3E4EE; --sea-2:#BFD6E4; --wind:#2B579E; --accent:#9A6200; --accent-soft:#F6E8CC;
  --port:#C42B2B; --stbd:#1C7A3A; --ok:#1C7A3A; --warn:#A35A00; --bad:#B42318; --nogo:rgba(180,35,24,.10);
  --f-display:"Fira Sans Extra Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0A1620; --surface:#10212E; --ink:#E2ECF2; --muted:#93A8B6; --line:#23394A;
  --sea:#0E2838; --sea-2:#14344A; --wind:#86AEF2; --accent:#F0B23C; --accent-soft:#3A2C10;
  --port:#FF7272; --stbd:#56CF7D; --ok:#56CF7D; --warn:#F0B23C; --bad:#FF7A6E; --nogo:rgba(255,114,114,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0A1620; --surface:#10212E; --ink:#E2ECF2; --muted:#93A8B6; --line:#23394A;
  --sea:#0E2838; --sea-2:#14344A; --wind:#86AEF2; --accent:#F0B23C; --accent-soft:#3A2C10;
  --port:#FF7272; --stbd:#56CF7D; --ok:#56CF7D; --warn:#F0B23C; --bad:#FF7A6E; --nogo:rgba(255,114,114,.12); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--f-body);margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3.1rem);letter-spacing:.005em}
h2{font-size:1.9rem}
h3{font-size:1.35rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.label{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.09em;font-size:.82rem;font-weight:600;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{background:var(--ink);color:var(--paper);padding-block:22px 26px}
.top .in{max-width:1180px;margin:0 auto;display:grid;gap:14px}
.crumbs{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;opacity:.8}
.toprow{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.lead{max-width:62ch;opacity:.86}
.langbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid color-mix(in srgb,var(--paper) 40%,transparent);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 14px;color:var(--paper);font-family:var(--f-display);font-weight:600;letter-spacing:.06em}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.track{font-family:var(--f-display);font-weight:600;letter-spacing:.05em;padding:5px 12px;border-radius:999px;background:var(--accent);color:#111}

/* shell */
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;padding-block:32px 96px}
.rail{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));align-self:start;display:grid;gap:4px}
.rail a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.95rem}
.rail a:hover{background:var(--surface)}
.rail .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);flex:none}
.rail a.done .dot{background:var(--ok);border-color:var(--ok)}
.prog{margin-top:14px;padding:12px;border-top:1px solid var(--line)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
main{min-width:0;display:grid;gap:56px}
section{display:grid;gap:18px;scroll-margin-top:16px}
.col{max-width:760px;display:grid;gap:16px}
.sechead{display:grid;gap:4px}

/* hook + goals */
.hook{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.goals{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.goals li{display:flex;gap:10px}
.goals li::before{content:"";flex:none;width:8px;height:8px;margin-top:.62em;border-radius:2px;background:var(--accent)}

/* theory cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:14px}
.card .num{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.fig{background:var(--sea);border-radius:8px;overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;max-height:440px}
.cap{font-size:.92rem;color:var(--muted)}
.body p+p{margin-top:10px}
.note{border-left:3px solid var(--accent);padding:6px 0 6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}

/* terms + tooltip */
.term{border-bottom:1.5px dashed var(--accent);cursor:help}
.term:hover,.term:focus{background:var(--accent-soft)}
#tip{position:fixed;z-index:50;max-width:320px;background:var(--ink);color:var(--paper);border-radius:10px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:.92rem;line-height:1.45;display:grid;gap:6px}
#tip .en{font-family:var(--f-mono);font-size:.78rem;opacity:.75}
#tip b{font-family:var(--f-display);font-size:1.1rem;letter-spacing:.02em}
#tip button{justify-self:start;background:none;border:1px solid color-mix(in srgb,var(--paper) 45%,transparent);border-radius:999px;padding:3px 12px;color:var(--paper);font-size:.85rem}

/* checks / quiz */
.check{border:1px dashed var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.fb{font-size:.95rem}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:.92rem}
.order{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.order li{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.order li span{flex:1;min-width:0}
.order li button{background:var(--paper);border:1px solid var(--line);border-radius:6px;width:30px;height:30px}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.score{font-family:var(--f-display);font-size:1.5rem}

/* simulator */
.sim{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.simview{align-self:start;background:var(--sea);border-radius:8px;position:relative;touch-action:none;user-select:none}
.simview svg{display:block;width:100%;height:auto;cursor:grab}
.streak{stroke:var(--wind);stroke-width:1.4;opacity:.35;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){.streaks{animation:flow 2.4s linear infinite}}
@keyframes flow{from{transform:translateY(-50px)}to{transform:translateY(0)}}
.panel{display:grid;gap:14px;align-content:start;min-width:0}
.gauges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:2px}
.g .v{font-family:var(--f-mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.g .big{font-family:var(--f-display);font-size:1.45rem;font-weight:600}
.g.wide{grid-column:1/-1}
.ctrl{display:grid;gap:4px}
.ctrl .row{display:flex;gap:8px;align-items:center}
.ctrl input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.ctrl .row button{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-family:var(--f-mono)}
.trim{padding:9px 12px;border-radius:8px;font-weight:500}
.trim.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}
.trim.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--warn)}
.trim.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad)}
.tasks{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.tasks li{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.tasks li .box{flex:none;width:18px;height:18px;border:2px solid var(--muted);border-radius:4px;margin-top:3px;display:grid;place-items:center;font-size:12px;color:var(--paper)}
.tasks li.done .box{background:var(--ok);border-color:var(--ok)}
.tasks li.done span{color:var(--muted);text-decoration:line-through}
.tasks li.cur span{font-weight:600}
.hint{font-size:.9rem;color:var(--muted)}

.onwater{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.onwater .card h3{font-size:1.15rem}
.onwater ul{margin:0;padding-left:18px;display:grid;gap:6px}

.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.gl{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:4px;align-content:start}
.gl b{font-family:var(--f-display);font-size:1.15rem;font-weight:600}
.gl .en{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.gl p{font-size:.92rem}

/* assistant */
#fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--accent);color:#111;border:0;border-radius:999px;padding:12px 18px;font-family:var(--f-display);font-weight:700;letter-spacing:.04em;font-size:1.05rem;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:8px;align-items:center}
#chat{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:45;width:min(420px,calc(100vw - 32px));height:min(600px,calc(100vh - 120px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.3);display:grid;grid-template-rows:auto minmax(0,1fr) auto auto}
#chat header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
#chat header h3{font-size:1.25rem}
#chat .x{background:none;border:0;font-size:1.3rem;line-height:1;padding:4px 8px}
#msgs{overflow-y:auto;padding:14px;display:grid;gap:10px;align-content:start}
.m{padding:9px 12px;border-radius:10px;max-width:90%;white-space:pre-wrap;font-size:.95rem;line-height:1.5}
.m.u{background:var(--ink);color:var(--paper);justify-self:end}
.m.a{background:var(--paper);justify-self:start}
.m.sys{font-size:.82rem;color:var(--muted);background:none;padding:0}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px}
.quick button{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.85rem}
#chatform{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--line)}
#chatform input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--paper);color:var(--ink);font:inherit}

@media (max-width:960px){
  .shell{grid-template-columns:minmax(0,1fr);gap:24px}
  .rail{position:static;display:flex;flex-wrap:wrap;gap:6px}
  .rail a{background:var(--surface);border:1px solid var(--line);padding:5px 10px;font-size:.88rem}
  .prog{display:none}
  .sim{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .hook,.onwater{grid-template-columns:minmax(0,1fr)}
  .card{padding:16px}
}
</style>

<header class="top wrap">
  <div class="in">
    <div class="crumbs"><span id="t-crumb1"></span><span aria-hidden="true">/</span><span id="t-crumb2"></span></div>
    <div class="toprow">
      <div style="display:grid;gap:10px;min-width:0">
        <h1 id="t-title"></h1>
        <p class="lead" id="t-lead"></p>
      </div>
      <div class="langbox">
        <div class="seg" role="group" aria-label="Language">
          <button id="lang-ru" aria-pressed="true">RU</button><button id="lang-en" aria-pressed="false">EN</button>
        </div>
        <span class="track" id="t-track"></span>
      </div>
    </div>
  </div>
</header>

<div class="shell wrap">
  <nav class="rail" id="rail" aria-label="Module"></nav>
  <main>
    <section id="goals">
      <div class="hook">
        <div class="fig" id="fig-hook"></div>
        <div style="display:grid;gap:12px;min-width:0">
          <span class="label" id="t-hook-l"></span>
          <h3 id="t-hook-q"></h3>
          <div class="opts" id="hook-opts"></div>
          <p class="fb" id="hook-fb" aria-live="polite"></p>
        </div>
      </div>
      <div class="col">
        <div class="sechead"><span class="label" id="t-goals-l"></span><h2 id="t-goals-h"></h2></div>
        <ul class="goals" id="goal-list"></ul>
      </div>
    </section>

    <section id="theory"><div class="col" id="theory-col"></div></section>

    <section id="sim">
      <div class="col">
        <div class="sechead"><span class="label" id="t-sim-l"></span><h2 id="t-sim-h"></h2></div>
        <p id="t-sim-p"></p>
      </div>
      <div class="sim">
        <div class="simview" id="simview"></div>
        <div class="panel">
          <div class="gauges" id="gauges"></div>
          <div class="trim" id="trim" aria-live="polite"></div>
          <div class="ctrl">
            <label class="label" for="hdg" id="t-helm"></label>
            <div class="row"><button id="hl" aria-label="-5°">−5°</button><input type="range" id="hdg" min="0" max="359" value="300"><button id="hr" aria-label="+5°">+5°</button></div>
          </div>
          <div class="ctrl">
            <label class="label" for="sheet" id="t-sheet"></label>
            <div class="row"><span class="hint" id="t-in"></span><input type="range" id="sheet" min="0" max="90" value="20"><span class="hint" id="t-out"></span></div>
          </div>
          <div>
            <span class="label" id="t-tasks"></span>
            <ul class="tasks" id="tasks" style="margin-top:8px"></ul>
          </div>
          <p class="hint" id="t-keys"></p>
        </div>
      </div>
    </section>

    <section id="water">
      <div class="col"><div class="sechead"><span class="label" id="t-water-l"></span><h2 id="t-water-h"></h2></div></div>
      <div class="onwater" id="onwater"></div>
    </section>

    <section id="quiz">
      <div class="col">
        <div class="sechead"><span class="label" id="t-quiz-l"></span><h2 id="t-quiz-h"></h2></div>
        <p id="t-quiz-p"></p>
        <div id="quizbox" style="display:grid;gap:16px"></div>
      </div>
    </section>

    <section id="glossary">
      <div class="col"><div class="sechead"><span class="label" id="t-gl-l"></span><h2 id="t-gl-h"></h2></div><p id="t-gl-p"></p></div>
      <div class="gloss" id="gloss"></div>
    </section>
  </main>
</div>

<div id="tip" role="tooltip" hidden></div>
<button id="fab" aria-expanded="false" aria-controls="chat"><span aria-hidden="true">⚓</span><span id="t-fab"></span></button>
<div id="chat" role="dialog" aria-labelledby="t-chat-h" hidden>
  <header><div><h3 id="t-chat-h"></h3><span class="hint" id="t-chat-sub"></span></div><button class="x" id="chatx" aria-label="Close">×</button></header>
  <div id="msgs" aria-live="polite"></div>
  <div class="quick" id="quick"></div>
  <form id="chatform"><input id="chatin" autocomplete="off"><button class="btn" id="t-send"></button></form>
</div>

<script>
(() => {
'use strict';
// ---------- state ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('sail.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('sail.' + k, JSON.stringify(v)); } catch {} }
};
let lang = store.get('lang', 'ru');
const done = store.get('done', {}); // section -> true
const $ = (id) => document.getElementById(id);
const t = (o) => (o && typeof o === 'object' && 'ru' in o) ? o[lang] : o;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- glossary ----------
const TERMS = {
  wind: { ru: ['Истинный ветер', 'Ветер, который ощущает неподвижный наблюдатель: на причале или на стоящей яхте. Его показывают прогнозы.'], en: ['True wind', 'The wind felt by a stationary observer, on the dock or on a boat at rest. Forecasts give the true wind.'] },
  apparent: { ru: ['Вымпельный ветер', 'Ветер, который ощущается на идущей яхте: сумма истинного ветра и встречного потока от движения. По нему настраивают паруса.'], en: ['Apparent wind', 'The wind felt on a moving boat: true wind plus the headwind from the boat\'s own motion. Sails are trimmed to it.'] },
  nogo: { ru: ['Мёртвая зона', 'Сектор около 40–45° по обе стороны от направления ветра, в котором парусная яхта не может идти: паруса полощут.'], en: ['No-go zone', 'A sector of about 40–45° either side of the wind direction where a sailing boat cannot sail: the sails just flap.'] },
  levent: { ru: ['Левентик', 'Положение яхты носом прямо против ветра. Паруса полощут, яхта теряет ход.'], en: ['Head to wind', 'The boat points straight into the wind. The sails flap and the boat loses way.'] },
  close: { ru: ['Бейдевинд', 'Курс острым углом к ветру, примерно 45–80°. Крутой бейдевинд ближе к 45°, полный ближе к 80°. Шкоты выбраны.'], en: ['Close-hauled / close reach', 'Sailing at a sharp angle to the wind, about 45–80°. Close-hauled is nearest 45°, a close reach nearer 80°. Sheets are pulled in.'] },
  beam: { ru: ['Галфвинд', 'Курс под углом около 90° к ветру: ветер дует точно в борт. Обычно самый быстрый и простой курс.'], en: ['Beam reach', 'Sailing at about 90° to the wind, which blows straight onto the side. Usually the fastest and easiest point of sail.'] },
  broad: { ru: ['Бакштаг', 'Курс, при котором ветер дует сзади-сбоку, примерно 100–160°. Шкоты потравлены.'], en: ['Broad reach', 'The wind comes from behind and to one side, about 100–160°. Sheets are eased out.'] },
  run: { ru: ['Фордевинд', 'Курс, при котором ветер дует прямо в корму (160–180°). Грот вынесен почти поперёк яхты. Опасен случайным перебросом гика.'], en: ['Run', 'The wind blows from straight behind (160–180°). The mainsail is let right out. Watch for an accidental gybe.'] },
  tack: { ru: ['Галс', 'Положение яхты относительно ветра. Правый галс: ветер дует в правый борт. Левый галс: ветер дует в левый борт.'], en: ['Tack (starboard / port)', 'Which side the wind comes over. Starboard tack: wind on the starboard (right) side. Port tack: wind on the port (left) side.'] },
  windward: { ru: ['Наветренный борт', 'Борт, на который дует ветер. Противоположный — подветренный, туда уходит гик.'], en: ['Windward side', 'The side the wind blows onto. The opposite side is leeward, where the boom goes.'] },

// ---------- boat drawing ----------
const TACK = (h) => { h = ((h % 360) + 360) % 360; return h === 0 || h === 180 ? 0 : (h < 180 ? -1 : 1); }; // -1 port (wind on left), +1 starboard
const twaOf = (h) => { h = ((h % 360) + 360) % 360; return h > 180 ? 360 - h : h; };
const optBoom = (awa) => Math.max(4, Math.min(88, (awa - 15) * 0.55));
function boat(x, y, h, o = {}) {
  const s = o.s || 1, twa = twaOf(h), tk = TACK(h);
  const boomA = o.boom != null ? o.boom : (twa < 40 ? 0 : optBoom(twa));
  const side = tk === -1 ? -1 : 1; // rotate sign: port tack -> boom to starboard -> rotate(-a)
  const rot = tk === 0 ? 0 : -side * boomA * (tk === -1 ? 1 : -1) * -1;
  // port tack (tk=-1): rotate(-boomA); starboard (tk=1): rotate(+boomA)
  const r = tk === -1 ? -boomA : tk === 1 ? boomA : 0;
  const luff = o.luff || twa < 40;
  const bx = -30 * Math.sin(r * Math.PI / 180), by = 30 * Math.cos(r * Math.PI / 180);
  const mx = 0, my = -6, ex = mx + bx, ey = my + by;
  const bulge = luff ? 0 : (tk === -1 ? 1 : -1) * 6; // sail belly to leeward
  const nx = (ey - my) / 30, ny = -(ex - mx) / 30;
  const cx = (mx + ex) / 2 + nx * bulge * -1, cy = (my + ey) / 2 + ny * bulge * -1;
  const hullFill = o.fill || 'var(--surface)';
  const edge = tk === -1 ? 'var(--port)' : tk === 1 ? 'var(--stbd)' : 'var(--muted)';
  return `<g transform="translate(${x} ${y}) rotate(${h}) scale(${s})" ${o.attr || ''}>
    <path d="M0,-30 C12,-15 13,6 9,28 L-9,28 C-13,6 -12,-15 0,-30Z" fill="${hullFill}" stroke="var(--ink)" stroke-width="${1.6 / s}"/>
    ${o.edge !== false && tk ? `<path d="${tk === -1 ? 'M0,-30 C-12,-15 -13,6 -9,28' : 'M0,-30 C12,-15 13,6 9,28'}" fill="none" stroke="${edge}" stroke-width="${3.2 / s}"/>` : ''}
    <path d="M${mx},${my} Q${cx.toFixed(1)},${cy.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}" fill="none" stroke="var(--ink)" stroke-width="${2.6 / s}" ${luff ? 'stroke-dasharray="3 3"' : ''}/>
    <circle cx="0" cy="-6" r="${2.4 / s + 1}" fill="var(--ink)"/>
  </g>`;
}
const windArrows = (xs, y0, len = 34) => xs.map((x) => `<g stroke="var(--wind)" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M${x},${y0} v${len}"/><path d="M${x - 6},${y0 + len - 8} L${x},${y0 + len} L${x + 6},${y0 + len - 8}"/></g>`).join('');
const txt = (x, y, s, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.a || 'middle'}" font-family="var(--f-display)" font-size="${o.fs || 15}" font-weight="${o.w || 600}" fill="${o.fill || 'var(--ink)'}" letter-spacing=".02em">${esc(s)}</text>`;

function figRose(sel) {
  const pts = [[0, 'levent'], [-50, 'close'], [50, 'close'], [-90, 'beam'], [90, 'beam'], [-135, 'broad'], [135, 'broad'], [180, 'run']];
  const R = 118, wedge = (a, r) => `${(r * Math.sin(a * Math.PI / 180)).toFixed(1)},${(-r * Math.cos(a * Math.PI / 180)).toFixed(1)}`;
  let s = `<svg viewBox="-210 -215 420 420" role="img" aria-label="${esc(t(CARDS[0].h))}">
    <path d="M0,0 L${wedge(-45, 200)} A200,200 0 0 1 ${wedge(45, 200)} Z" fill="var(--nogo)"/>
    ${txt(0, -150, t(TERMS.nogo)[0], { fs: 14, fill: 'var(--bad)' })}
    <circle r="${R}" fill="none" stroke="var(--sea-2)" stroke-width="2" stroke-dasharray="4 6"/>
    ${windArrows([-60, 0, 60], -212, 30)}
    ${txt(95, -190, lang === 'ru' ? 'ВЕТЕР' : 'WIND', { fs: 13, fill: 'var(--wind)', a: 'start' })}`;
  pts.forEach(([a, k], i) => {
    const h = (a + 360) % 360, x = R * Math.sin(a * Math.PI / 180), y = -R * Math.cos(a * Math.PI / 180);
    const sel2 = sel === i;
    s += boat(x, y, h, { s: 0.8, fill: sel2 ? 'var(--accent-soft)' : undefined, attr: `data-i="${i}" style="cursor:pointer" tabindex="0" role="button" aria-label="${esc(t(TERMS[k])[0])}"` });
    const lr = 180, lx = lr * Math.sin(a * Math.PI / 180), ly = -lr * Math.cos(a * Math.PI / 180) + 5;
    if (a !== 0) s += txt(lx, Math.max(-170, Math.min(200, ly)), t(TERMS[k])[0].split(' / ')[0], { fs: 14, fill: sel2 ? 'var(--accent)' : 'var(--ink)' });
  });
  return s + '</svg>';
}

function arrow(x1, y1, x2, y2, c, w = 3) {
  const a = Math.atan2(y2 - y1, x2 - x1), L = 11;

  return `<g stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M${x1},${y1} L${x2},${y2}"/><path d="M${p1[0].toFixed(1)},${p1[1].toFixed(1)} L${x2},${y2} L${p2[0].toFixed(1)},${p2[1].toFixed(1)}"/></g>`;
}

function mark(k) { if (!done[k]) { done[k] = true; store.set('done', done); const a = document.querySelector(`#rail a[href="#${k}"]`); if (a) a.classList.add('done'); const i = document.querySelector('#rail .bar i'); if (i) i.style.width = Math.round(Object.keys(UI.rail).filter((x) => done[x]).length / 6 * 100) + '%'; } }

// ---------- tooltip ----------
const tip = $('tip'); let tipFor = null;
function showTip(el) {
  const k = el.dataset.t, v = TERMS[k]; if (!v) return;
  tipFor = el;
  tip.innerHTML = `<b>${esc(v[lang][0])}</b><span class="en">${esc(lang === 'ru' ? 'EN: ' + v.en[0] : 'RU: ' + v.ru[0])}</span><span>${esc(v[lang][1])}</span><button data-ask="${k}">${esc(t(UI.ask))}</button>`;
  tip.hidden = false;
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = Math.min(Math.max(8, r.left + r.width / 2 - tw / 2), window.innerWidth - tw - 8);
  let y = r.bottom + 8; if (y + th > window.innerHeight - 8) y = r.top - th - 8;
  tip.style.left = x + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.hidden = true; tipFor = null; }
let hideT;
document.addEventListener('mouseover', (e) => { const el = e.target.closest('.term'); if (el) { clearTimeout(hideT); showTip(el); } else if (e.target.closest('#tip')) clearTimeout(hideT); });
document.addEventListener('mouseout', (e) => { if (e.target.closest('.term') || e.target.closest('#tip')) { hideT = setTimeout(hideTip, 250); } });
document.addEventListener('focusin', (e) => { const el = e.target.closest('.term'); if (el) showTip(el); });
document.addEventListener('focusout', (e) => { if (e.target.closest('.term')) hideT = setTimeout(hideTip, 250); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideTip(); });
window.addEventListener('scroll', () => { if (!tip.hidden) hideTip(); }, { passive: true });

// ---------- clicks ----------
document.addEventListener('click', (e) => {
  const termEl = e.target.closest('.term');
  if (termEl) { if (tipFor === termEl && !tip.hidden) hideTip(); else showTip(termEl); return; }
  const ask = e.target.closest('[data-ask]');
  if (ask) { const v = TERMS[ask.dataset.ask]; hideTip(); openChat(); sendQ((lang === 'ru' ? 'Объясни подробнее с примером: ' : 'Explain in more detail with an example: ') + v[lang][0]); return; }
  const rb = e.target.closest('#fig-c1 [data-i]');
  if (rb) { roseSel = +rb.dataset.i; drawFigs(); return; }
  const hk = e.target.closest('#hook-opts .opt');
  if (hk) { const ok = +hk.dataset.i === 0; document.querySelectorAll('#hook-opts .opt').forEach((b) => b.classList.remove('right', 'wrong')); hk.classList.add(ok ? 'right' : 'wrong'); const fb = $('hook-fb'); fb.textContent = t(ok ? UI.hookOk : UI.hookNo); fb.className = 'fb ' + (ok ? 'ok' : 'no'); if (ok) mark('goals'); return; }
  const ck = e.target.closest('.check .opt');
  if (ck) { const box = ck.closest('.check'), c = CARDS[+box.dataset.card].check, j = +ck.dataset.j, ok = j === c.a;
    box.querySelectorAll('.opt').forEach((b, i) => { b.classList.remove('right', 'wrong'); if (i === c.a && ok) b.classList.add('right'); });
    if (!ok) ck.classList.add('wrong');
    const fb = box.querySelector('.fb'); fb.className = 'fb ' + (ok ? 'ok' : 'no'); fb.textContent = (ok ? '✓ ' : '✗ ') + t(c.e);
    if (document.querySelectorAll('.check .opt.right').length >= 2) mark('theory'); return; }
  if (e.target.closest('#chatx')) { closeChat(); return; }
  if (e.target.closest('#fab')) { $('chat').hidden ? openChat() : closeChat(); return; }
  const qk = e.target.closest('#quick button'); if (qk) { sendQ(qk.textContent); return; }

  const io = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting && en.target.id === 'water') mark('water'); if (en.isIntersecting && en.target.id === 'glossary') mark('glossary'); }), { threshold: 0.4 });
  ['water', 'glossary'].forEach((id) => io.observe($(id)));
}

// ---------- boot ----------
renderText();
simInit();
setH(sim.h); setS(sim.sheet);
requestAnimationFrame(loop);
})();
</script>
