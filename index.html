<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Яхтенная школа</title>
<meta name="description" content="Интерактивная теория для яхтсменов: уроки со схемами, тренажёры, квизы, словарь и ИИ-помощник. RU — ГИМС, EN — IYT Day Skipper.">
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar wrap">
  <div class="in">
    <a class="brand" href="#home"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8 L32 50 L12 50 Z" fill="currentColor"/><path d="M35 14 Q50 32 35 46 Z" fill="var(--accent)"/><path d="M8 54 H56" stroke="currentColor" stroke-width="3"/></svg><span id="t-brand"></span></a>
    <nav class="topnav" id="topnav" aria-label="Main"></nav>
    <div class="langbox">
      <div class="seg" role="group" aria-label="Language"><button id="lang-ru" aria-pressed="true">RU</button><button id="lang-en" aria-pressed="false">EN</button></div>
      <span class="track" id="t-track"></span>
    </div>
  </div>
</header>
<main id="main"></main>
<div id="tip" role="tooltip" hidden></div>
<button id="fab" aria-expanded="false" aria-controls="chat"><span aria-hidden="true">⚓</span><span id="t-fab"></span></button>
<div id="chat" role="dialog" aria-labelledby="t-chat-h" hidden>
  <header><div><h3 id="t-chat-h"></h3><span class="hint" id="t-chat-sub"></span></div><button class="x" id="chatx" aria-label="Close">×</button></header>
  <div id="msgs" aria-live="polite"></div>
  <div class="quick" id="quick"></div>
  <form id="chatform"><input id="chatin" autocomplete="off" aria-label="Question"><button class="btn" id="t-send"></button></form>
</div>
<script src="js/draw.js"></script>
<script src="js/core.js"></script>
<script src="js/glossary.js"></script>
<script src="js/course.js"></script>
<script src="js/modules/s1.js"></script>
<script src="js/modules/s2.js"></script>
<script src="js/modules/s3.js"></script>
<script src="js/modules/s5.js"></script>
<script src="js/sims/points.js"></script>
<script src="js/sims/trainer.js"></script>
<script src="js/sims/colregs.js"></script>
<script src="js/sims/lights.js"></script>
<script src="js/sims/buoyage.js"></script>
<script src="js/sims/mob.js"></script>
<script src="js/sims/knots.js"></script>
</body>
</html>
